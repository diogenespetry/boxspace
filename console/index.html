<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BoxSpace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Cpath%20d=%27M16%203%2027%209.5%2016%2016%205%209.5z%27%20fill=%27%23F2C230%27/%3E%3Cpath%20d=%27M5%209.5%2016%2016v13L5%2022.5z%27%20fill=%27%231E4D6B%27/%3E%3Cpath%20d=%27M27%209.5%2016%2016v13l11-6.5z%27%20fill=%27%232F7399%27/%3E%3C/svg%3E">
<style>
/* ===== Tokens ===== */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --well: #F5F7F9;
  --line: #DCE2E7;
  --line-strong: #C5CED6;
  --ink: #15202A;
  --ink-2: #4A5865;
  --ink-3: #7B8894;
  --steel: #1E4D6B;
  --steel-hover: #163B53;
  --steel-ink: #1E4D6B;
  --steel-soft: #E1EAF1;
  --rail: #1E4D6B;
  --rail-deep: #173E57;
  --mark: #F2C230;
  --mark-soft: #FFF5D1;
  --mark-ink: #6B5100;
  --ok: #2F7A4F;
  --ok-soft: #DFF1E6;
  --danger: #B3362B;
  --danger-soft: #FBE5E2;
  --shadow: 0 1px 2px rgba(16, 40, 60, .06), 0 1px 1px rgba(16, 40, 60, .04);
  --shadow-lg: 0 24px 60px rgba(12, 30, 45, .28);
  --display: Bahnschrift, "DIN Alternate", "DIN 2014", "Roboto Condensed", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --r: 8px;
  --r-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E171E;
    --surface: #16212A;
    --well: #1B2832;
    --line: #26353F;
    --line-strong: #344651;
    --ink: #E5ECF1;
    --ink-2: #A7B5C0;
    --ink-3: #7A8994;
    --steel: #3B83B3;
    --steel-hover: #4A93C4;
    --steel-ink: #86BCE0;
    --steel-soft: #1D3445;
    --rail: #10283A;
    --rail-deep: #0C2030;
    --mark-soft: #3A3011;
    --mark-ink: #F2D474;
    --ok: #55B37D;
    --ok-soft: #173525;
    --danger: #E06C61;
    --danger-soft: #3D1D1A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
  }
}

/* ===== Base ===== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.5 var(--body); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; accent-color: var(--steel); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--steel-ink); }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .005em; margin: 0; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.08rem; line-height: 1.3; }
h3 { font-size: .98rem; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .86rem; }
code, .mono { font-family: var(--mono); font-size: .86em; word-break: break-all; }
[hidden] { display: none !important; }
.icon { width: 1.15em; height: 1.15em; flex: none; }

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 36px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 14px; border-radius: var(--r); cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); font-weight: 500; transition: background .12s, border-color .12s; }
.btn:hover { border-color: var(--ink-3); background: var(--well); }
.btn.primary { background: var(--steel); border-color: var(--steel); color: #fff; }
.btn.primary:hover { background: var(--steel-hover); border-color: var(--steel-hover); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--well); }
.btn.link { border: 0; background: none; min-height: 0; padding: 4px 6px; color: var(--steel-ink); font-weight: 500; }
.btn.link:hover { text-decoration: underline; background: none; }
.btn.link.danger { color: var(--danger); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: default; }

/* ===== Forms ===== */
.field { display: grid; gap: 5px; margin-bottom: 14px; }
.field label, .label { font-size: .84rem; font-weight: 500; color: var(--ink-2); }
.input, .field input, .field select, .field textarea { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 0 11px; min-height: 38px; background: var(--surface); width: 100%; }
.field textarea { font-family: var(--mono); font-size: .85rem; min-height: 220px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--steel); box-shadow: 0 0 0 3px var(--steel-soft); }
.sm-only { display: none; }
.hint { font-size: .84rem; color: var(--ink-3); margin-top: -8px; margin-bottom: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 4px; }
.err { color: var(--danger); font-size: .9rem; min-height: 1.4em; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 42px; height: 24px; appearance: none; background: var(--line-strong); border-radius: 99px; position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.switch input:checked { background: var(--steel); }
.switch input:checked::after { transform: translateX(18px); }
.switch input:disabled { opacity: .5; cursor: default; }
.switch span { font-size: .9rem; color: var(--ink-2); }

/* Choice cards (radio groups) */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.choice { position: relative; display: grid; align-content: start; gap: 3px; padding: 14px 16px 14px 44px; border: 1px solid var(--line-strong); border-radius: var(--r); cursor: pointer; background: var(--surface); transition: border-color .12s, background .12s; }
.choice:hover { border-color: var(--ink-3); }
.choice input { position: absolute; left: 16px; top: 17px; margin: 0; }
.choice b { font-weight: 600; }
.choice span { font-size: .86rem; color: var(--ink-2); }
.choice:has(input:checked) { border-color: var(--steel); background: var(--steel-soft); box-shadow: inset 0 0 0 1px var(--steel); }
.choice:has(input:disabled) { cursor: default; opacity: .7; }

/* ===== Login ===== */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 520px); background: var(--surface); }
.login-brand { position: relative; background: var(--rail); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.login-brand .wordmark { display: flex; align-items: center; gap: 14px; }
.login-brand .wordmark span { font-family: var(--display); font-size: clamp(2.6rem, 5vw, 3.6rem); font-weight: 600; letter-spacing: .01em; }
.login-brand p { margin-top: 14px; font-size: 1.1rem; color: #C9DAE6; max-width: 30ch; }
.login-brand .stripes { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: repeating-linear-gradient(-45deg, var(--mark) 0 16px, var(--rail-deep) 16px 32px); }
.login-form { display: grid; place-items: center; padding: 32px; background: var(--bg); }
.login-form form { width: min(380px, 100%); }
.login-form h1 { margin-bottom: 4px; }
.login-form .sub { color: var(--ink-2); margin-bottom: 24px; }

/* ===== Shell ===== */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--rail) 236px, transparent 236px); }
.rail { background: var(--rail); color: #fff; display: flex; flex-direction: column; padding: 18px 12px 16px; position: sticky; top: 0; height: 100vh; align-self: start; }
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; text-decoration: none; color: #fff; }
.rail .brand span { font-family: var(--display); font-size: 1.4rem; font-weight: 600; }
.rail nav { display: grid; gap: 2px; }
.rail .group { font-size: .74rem; font-weight: 600; color: #93B1C6; padding: 14px 12px 6px; letter-spacing: .02em; }
.rail nav a { color: #D6E3EC; text-decoration: none; padding: 8px 12px; border-radius: var(--r); display: flex; gap: 11px; align-items: center; position: relative; font-weight: 500; }
.rail nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.rail nav a[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; }
.rail nav a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 3px 3px 0; background: var(--mark); }
.rail .who { margin-top: auto; padding: 12px; border-radius: var(--r); background: rgba(0,0,0,.14); display: flex; align-items: center; gap: 10px; }
.rail .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--mark); color: #2B2100; font-weight: 700; font-family: var(--display); flex: none; }
.rail .who-text { min-width: 0; flex: 1; font-size: .84rem; color: #B9CEDC; }
.rail .who-text strong { display: block; color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail .who .btn { min-height: 30px; padding: 0 10px; color: #fff; background: transparent; border-color: rgba(255,255,255,.25); font-size: .85rem; }
.rail .who .btn:hover { background: rgba(255,255,255,.1); }
main { padding: 30px 40px 72px; min-width: 0; max-width: 1240px; width: 100%; }

/* ===== Page header ===== */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head .lead { margin-top: 6px; color: var(--ink-2); max-width: 72ch; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--r); padding: 12px 14px; margin-bottom: 18px; font-size: .92rem; background: var(--mark-soft); color: var(--mark-ink); border: 1px solid color-mix(in srgb, var(--mark) 55%, transparent); }
.banner.bad { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.banner a { color: inherit; font-weight: 600; }

/* Breadcrumb with the floor marking */
.path { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px; font-family: var(--display); font-size: 1.55rem; font-weight: 600; padding-bottom: 6px; border-bottom: 4px solid var(--mark); width: fit-content; max-width: 100%; line-height: 1.2; }
.path a { text-decoration: none; color: var(--ink-3); padding: 0 2px; border-radius: 3px; }
.path a:hover { color: var(--steel-ink); }
.path .sep { color: var(--ink-3); padding: 0 5px; font-weight: 400; }
.path .here { color: var(--ink); word-break: break-all; }
.tabs { display: flex; gap: 4px; margin: 20px 0 18px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--steel); }

/* ===== Cards ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 22px; }
.card-head .desc { margin-top: 4px; color: var(--ink-2); font-size: .9rem; max-width: 70ch; }
.card-head .ctl { flex: none; padding-top: 2px; }
.card-body { padding: 0 22px 20px; }
.card-body.flush { padding: 0; border-top: 1px solid var(--line); }
.card-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 22px; background: var(--well); border-top: 1px solid var(--line); flex-wrap: wrap; }
.card-foot .left { margin-right: auto; }
.card.locked .card-head .ctl { opacity: .7; }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: .78rem; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--well); white-space: nowrap; }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--well); }
tbody tr.sel { background: var(--mark-soft); }
td.r, th.r { text-align: right; }
td.cb, th.cb { width: 40px; padding-right: 0; }
td.name { word-break: break-all; }
td.name a { text-decoration: none; color: var(--ink); font-weight: 500; display: inline-flex; gap: 10px; align-items: center; }
td.name a:hover { color: var(--steel-ink); }
td.name .icon { color: var(--ink-3); }
td.name a:hover .icon { color: var(--steel-ink); }
.ficon { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--steel-soft); color: var(--steel-ink); flex: none; }
.ficon.folder { background: var(--mark-soft); color: var(--mark-ink); }
.ficon .icon { color: inherit !important; }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; }
.usage { display: grid; gap: 4px; min-width: 120px; }
.bar { height: 6px; border-radius: 3px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--steel); border-radius: 3px; }
.bar.warn i { background: var(--mark); }
.bar.bad i { background: var(--danger); }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 500; padding: 2px 9px 2px 8px; border-radius: 99px; background: var(--steel-soft); color: var(--steel-ink); white-space: nowrap; margin: 1px 4px 1px 0; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--mark-soft); color: var(--mark-ink); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.plain { background: var(--well); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }

/* Empty states */
.empty { padding: 44px 24px; text-align: center; color: var(--ink-2); display: grid; justify-items: center; gap: 8px; }
.empty .art { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--well); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 6px; }
.empty .art .icon { width: 30px; height: 30px; }
.empty h3 { color: var(--ink); font-size: 1.05rem; }
.empty p { max-width: 46ch; }
.empty .btn { margin-top: 8px; }

/* Toolbar, bulk bar */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 260px; max-width: 440px; display: flex; gap: 6px; }
.search .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { padding-left: 36px; }
.bulk { display: flex; gap: 8px; align-items: center; background: var(--rail); color: #fff; border-radius: var(--r); padding: 5px 6px 5px 14px; flex-wrap: wrap; box-shadow: var(--shadow); }
.bulk b { font-weight: 600; margin-right: 6px; }
.bulk .btn { min-height: 30px; font-size: .88rem; background: rgba(255,255,255,.12); border-color: transparent; color: #fff; }
.bulk .btn:hover { background: rgba(255,255,255,.2); }
.bulk .btn.danger { color: #FFC9C2; }
.note { font-size: .88rem; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.dropping .card { outline: 3px dashed var(--steel); outline-offset: -3px; }
.more { padding: 12px; text-align: center; border-top: 1px solid var(--line); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--display); font-size: 1.85rem; font-weight: 600; line-height: 1.15; }
.stat span { font-size: .86rem; color: var(--ink-2); }

/* Editable row boxes */
.grid-rows { display: grid; gap: 10px; }
.row-box { display: grid; gap: 10px; align-items: end; padding: 14px; background: var(--well); border: 1px solid var(--line); border-radius: var(--r); }
.rule { grid-template-columns: 1.4fr repeat(3, .8fr) auto auto; }
.hook { grid-template-columns: 2fr 1.2fr .8fr .8fr auto; }
.target { grid-template-columns: 1.6fr 1fr .7fr 1fr 1fr; }
.target .opts { grid-column: 1 / -1; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.grant { grid-template-columns: 1fr 180px auto; }
.trio { grid-template-columns: repeat(3, 1fr); }
.quad { grid-template-columns: repeat(4, 1fr); }
.row-box .field { margin: 0; }

/* Disk bays */
.bays { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.bay { border: 1px solid var(--line); border-radius: var(--r); background: var(--well); padding: 14px; display: grid; gap: 10px; }
.bay-top { display: flex; align-items: center; gap: 10px; }
.drive { width: 34px; height: 44px; border-radius: 5px; background: var(--steel); position: relative; flex: none; box-shadow: inset 0 -10px 0 rgba(0,0,0,.18); }
.drive::after { content: ""; position: absolute; left: 7px; bottom: 4px; width: 6px; height: 6px; border-radius: 50%; background: #6EE7A0; box-shadow: 0 0 6px #6EE7A0; }
.bay.off .drive { background: var(--line-strong); }
.bay.off .drive::after { background: #FF7A6E; box-shadow: 0 0 6px #FF7A6E; }
.bay-title { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.bay code { font-size: .8rem; color: var(--ink-2); }

/* Erasure diagram */
.shards { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 14px; }
.shard { min-width: 38px; height: 30px; padding: 0 6px; border-radius: 5px; display: grid; place-items: center; font: 600 .75rem var(--mono); }
.shard.d { background: var(--steel); color: #fff; }
.shard.p { background: var(--mark-soft); color: var(--mark-ink); box-shadow: inset 0 0 0 2px var(--mark); }

/* Key/value lists */
dl.kv { display: grid; grid-template-columns: 10em 1fr; gap: 8px 14px; margin: 0; font-size: .92rem; }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; word-break: break-word; }
pre { background: var(--well); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; overflow: auto; font: .84rem/1.55 var(--mono); margin: 8px 0 14px; }
.snippets h3 { margin: 16px 0 0; font-size: .92rem; }

/* Drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(540px, 100%); background: var(--surface); border-left: 1px solid var(--line); transform: translateX(100%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; z-index: 20; display: flex; flex-direction: column; }
.drawer.open { transform: none; visibility: visible; box-shadow: var(--shadow-lg); transition: transform .22s ease; }
.drawer header { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer header h2 { word-break: break-all; font-size: 1.2rem; }
.drawer .body { padding: 20px 22px; overflow: auto; flex: 1; display: grid; gap: 18px; align-content: start; }
.preview { border: 1px solid var(--line); border-radius: var(--r); background: repeating-conic-gradient(var(--well) 0% 25%, var(--surface) 0% 50%) 50% / 18px 18px; overflow: hidden; }
.preview img, .preview video { display: block; max-width: 100%; max-height: 340px; margin: 0 auto; }
.preview iframe { display: block; width: 100%; height: 400px; border: 0; background: #fff; }
.preview audio { display: block; width: 100%; }
.preview pre { margin: 0; border: 0; border-radius: 0; max-height: 300px; white-space: pre-wrap; word-break: break-word; }
.versions { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.versions li { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: .9rem; align-items: center; }
.versions li:last-child { border-bottom: 0; }

/* Dialog */
dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(560px, calc(100% - 32px)); box-shadow: var(--shadow-lg); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(12, 26, 38, .5); backdrop-filter: blur(2px); }
dialog form { padding: 24px; max-height: calc(100vh - 60px); overflow: auto; }
dialog h2 { margin-bottom: 14px; font-size: 1.25rem; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.secret { font-family: var(--mono); background: var(--well); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 12px; word-break: break-all; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .86rem; }

/* Uploads, toasts */
.uploads { position: fixed; right: 20px; bottom: 20px; width: min(370px, calc(100% - 40px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); z-index: 30; overflow: hidden; }
.uploads header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.uploads ul { list-style: none; margin: 0; padding: 6px 14px 10px; max-height: 260px; overflow: auto; }
.uploads li { padding: 7px 0; font-size: .88rem; }
.uploads .bar { margin-top: 5px; height: 4px; }
.uploads li.failed .bar i { background: var(--danger); }
.uploads li.done .bar i { background: var(--ok); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 11px 18px; border-radius: var(--r); z-index: 40; font-size: .92rem; max-width: calc(100% - 40px); box-shadow: var(--shadow-lg); }
.toast.bad { background: var(--danger); color: #fff; }

/* ===== Responsive ===== */
@media (max-width: 860px) {
  .login { grid-template-columns: 1fr; }
  .login-brand { padding: 32px 24px 44px; }
  .login-brand p { display: none; }
  .shell { grid-template-columns: minmax(0, 1fr); background: none; }
  .rail { position: relative; height: auto; padding: 10px 12px; min-width: 0; }
  .rail .brand { padding: 4px 6px 8px; }
  .rail .group { display: none; }
  .rail nav { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .rail nav a { white-space: nowrap; padding: 7px 10px; }
  .rail nav a[aria-current="page"]::before { left: 10px; right: 10px; top: auto; bottom: 0; width: auto; height: 3px; border-radius: 3px 3px 0 0; }
  .rail .who { position: absolute; top: 10px; right: 12px; background: none; padding: 0; }
  .rail .who-text, .rail .avatar { display: none; }
  main { padding: 20px 14px 72px; }
  .hide-sm { display: none; }
  .sm-only { display: inline; }
  .card-head { flex-direction: column; padding: 16px; }
  .card-body { padding: 0 16px 16px; }
  .card-foot { padding: 12px 16px; }
  .card table thead { display: none; }
  .card tbody tr { display: grid; grid-template-columns: auto 1fr auto; align-items: center; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .card tbody tr:last-child { border-bottom: 0; }
  .card td { border: 0; padding: 4px 12px; }
  .card td.name, .card td.wide { grid-column: 1 / -1; }
  .card td.cb { grid-row: 1; grid-column: 1; padding-right: 0; }
  .card td.cb + td.name { grid-row: 1; grid-column: 2 / -1; }
  .card td.cb ~ td:not(.name) { grid-column: auto; }
  .card tr:has(td.cb) td:nth-child(3) { grid-column: 2; }
  .card td.r { text-align: left; white-space: nowrap; }
  .row-actions { flex-wrap: wrap; }
  .rule, .hook, .target, .grant, .trio, .quad { grid-template-columns: 1fr 1fr; }
  dl.kv { grid-template-columns: 1fr; gap: 2px 0; }
  dl.kv dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

:root {
  --r: 10px;
  --r-lg: 16px;
  --shadow: 0 1px 2px rgba(16,40,60,.05), 0 4px 14px rgba(16,40,60,.05);

h1 { font-size: 1.9rem; letter-spacing: -.01em; }

main > * { animation: rise .35s ease both; }
main > *:nth-child(2) { animation-delay: .05s; }
main > *:nth-child(3) { animation-delay: .1s; }
main > *:nth-child(n+4) { animation-delay: .14s; }

.btn { border-radius: var(--r); box-shadow: 0 1px 1px rgba(16,40,60,.05); transition: background .15s, border-color .15s, box-shadow .15s, transform .08s; }

.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.primary { background: var(--grad); border-color: transparent; box-shadow: 0 2px 8px color-mix(in srgb, var(--steel) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.18); }
.btn.primary:hover { filter: brightness(1.08); background: var(--grad); border-color: transparent; box-shadow: 0 4px 14px color-mix(in srgb, var(--steel) 50%, transparent), inset 0 1px 0 rgba(255,255,255,.18); }
.btn.ghost, .btn.link { box-shadow: none; }
.btn.ghost:hover, .btn.link:hover { box-shadow: none; }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.danger.solid:hover { background: var(--danger); filter: brightness(1.08); }

/* Formulários */
.input, .field input, .field select, .field textarea { border-radius: var(--r); transition: border-color .15s, box-shadow .15s; }

.switch input { background: var(--line-strong); box-shadow: inset 0 1px 2px rgba(0,0,0,.12); }

.choice { border-radius: var(--r); }

.login-brand { background: radial-gradient(600px 400px at 20% 10%, rgba(255,255,255,.14), transparent 60%), linear-gradient(160deg, #2A6A94 0%, #1E4D6B 45%, #0F2C40 100%); }
.login-brand::before { content: ""; position: absolute; width: 520px; height: 520px; right: -180px; top: -160px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--mark) 30%, transparent), transparent 65%); filter: blur(10px); }
.login-brand::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(circle at 30% 40%, #000, transparent 75%); -webkit-mask-image: radial-gradient(circle at 30% 40%, #000, transparent 75%); pointer-events: none; }
.login-brand > * { position: relative; z-index: 1; }

.login-form { background: radial-gradient(500px 300px at 80% 0%, color-mix(in srgb, var(--steel) 10%, transparent), transparent 70%), var(--bg); }

/* Barra lateral */
.rail { background: linear-gradient(180deg, var(--rail) 0%, var(--rail-deep) 100%); box-shadow: 4px 0 24px rgba(10,30,45,.18); }

.rail nav a[aria-current="page"] { background: linear-gradient(90deg, rgba(255,255,255,.17), rgba(255,255,255,.06)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.rail nav a[aria-current="page"]::before { box-shadow: 0 0 12px var(--mark); }
.rail .who { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); }

/* Cabeçalhos e abas */
.page-head { padding-bottom: 18px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
.path { border-bottom-width: 3px; }
.tabs { gap: 2px; }
.tabs a { border-radius: 8px 8px 0 0; transition: background .15s, color .15s; }
.tabs a:hover { background: var(--well); }
.tabs a[aria-current="page"] { border-bottom-width: 3px; color: var(--steel-ink); font-weight: 600; }

/* Cartões */
.card { transition: box-shadow .2s, border-color .2s; }
.card:hover { box-shadow: var(--shadow-hover); }
.card-head h2 { font-size: 1.12rem; }
.card-foot { background: linear-gradient(180deg, var(--well), color-mix(in srgb, var(--well) 70%, var(--surface))); }
.banner { border-radius: var(--r); box-shadow: var(--shadow); }

/* Estatísticas */
.stat { position: relative; overflow: hidden; padding: 18px 20px 18px 22px; transition: transform .2s, box-shadow .2s; }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--grad); }
.stat:nth-child(4n+2)::before { background: linear-gradient(180deg, #FFD95A, #F2C230); }
.stat:nth-child(4n+3)::before { background: linear-gradient(180deg, #4FB57F, #2F7A4F); }
.stat:nth-child(4n+4)::before { background: linear-gradient(180deg, #8E7CD6, #5B4BB0); }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat b { font-size: 2.05rem; letter-spacing: -.01em; }
.stat span { text-transform: uppercase; font-size: .72rem; letter-spacing: .07em; font-weight: 600; color: var(--ink-3); }

/* Tabelas */
th { text-transform: uppercase; font-size: .7rem; letter-spacing: .07em; padding: 11px 16px; }
td { padding: 12px 16px; }
tbody tr:hover { background: color-mix(in srgb, var(--steel-soft) 55%, transparent); }
.ficon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--steel-soft), color-mix(in srgb, var(--steel-soft) 60%, var(--surface))); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--steel) 12%, transparent); }
.ficon.folder { background: linear-gradient(135deg, #FFE48A, var(--mark-soft)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mark) 45%, transparent); }
@media (prefers-color-scheme: dark) { .ficon.folder { background: var(--mark-soft); } }
.bar { height: 8px; border-radius: 99px; }
.bar i { border-radius: 99px; background: var(--grad); transition: width .5s ease; }
.bar.warn i { background: linear-gradient(90deg, #F8D766, #F2C230); }
.bar.bad i { background: linear-gradient(90deg, #E5796E, #B3362B); }
.chip { padding: 3px 10px 3px 9px; box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 14%, transparent); }
.chip.ok i { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.empty { padding: 56px 24px; }
.empty .art { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, var(--steel-soft), var(--well)); color: var(--steel-ink); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }

/* Barras de ferramentas */
.bulk { background: var(--grad); border-radius: 12px; box-shadow: 0 6px 20px color-mix(in srgb, var(--steel) 35%, transparent); animation: rise .2s ease both; }
.dropping .card { outline-color: var(--steel); background: color-mix(in srgb, var(--steel-soft) 40%, var(--surface)); }

/* Discos / diagrama */
.bay { background: var(--surface); box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
.bay:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.drive { background: linear-gradient(160deg, #3C86B5, #1E4D6B); }
.shard { border-radius: 7px; }
.shard.d { background: var(--grad); }
.row-box { border-radius: 12px; }
pre { border-radius: 10px; }

/* Gaveta, diálogo, avisos */
.drawer { border-left: 0; box-shadow: none; }
.drawer.open { box-shadow: -20px 0 60px rgba(12,30,45,.28); }
.drawer header { background: linear-gradient(180deg, var(--well), var(--surface)); }
dialog { border-radius: 20px; border: 1px solid var(--line); }
dialog[open] { animation: rise .22s ease both; }
dialog::backdrop { background: rgba(8,20,30,.55); backdrop-filter: blur(5px); }
.uploads { border-radius: 16px; }
.toast { border-radius: 12px; padding: 12px 20px; animation: rise .25s ease both; }

/* Barra de rolagem */
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
@media (max-width: 860px) {
  .shell { background: none; }
  .rail { box-shadow: 0 4px 16px rgba(10,30,45,.2); }
  .rail nav a:hover { transform: none; }
  .login-form form { padding: 26px 22px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = n => `<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const enc = encodeURIComponent;
const state = { me: null };
let pollTimer;

function size(n) {
  if (n == null) return "";
  const u = ["B", "KB", "MB", "GB", "TB", "PB"];
  let i = 0; let v = Number(n);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v < 10 ? 1 : 0)).toLocaleString("pt-BR") + " " + u[i];
}
const when = d => d ? new Date(d).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";
const whenFull = d => d ? new Date(d).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "medium" }) : "";
const chip = (text, kind = "") => `<span class="chip ${kind}"><i></i>${esc(text)}</span>`;

/* ---------- building blocks ---------- */
const pageHead = (title, lead = "", actions = "") =>
  `<div class="page-head"><div><h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
function card({ title, desc = "", ctl = "", body = "", flush = false, foot = "", cls = "" }) {
  return `<section class="card ${cls}">
    ${title ? `<div class="card-head"><div><h2>${title}</h2>${desc ? `<p class="desc">${desc}</p>` : ""}</div>${ctl ? `<div class="ctl">${ctl}</div>` : ""}</div>` : ""}
    ${body ? `<div class="card-body${flush ? " flush" : ""}">${body}</div>` : ""}
    ${foot ? `<div class="card-foot">${foot}</div>` : ""}
  </section>`;
}
const empty = (art, title, text, action = "") => `<div class="empty"><div class="art">${icon(art)}</div><h3>${title}</h3><p>${text}</p>${action}</div>`;
const sw = (id, on, label, disabled) => `<label class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""} ${disabled ? "disabled" : ""}><span>${label}</span></label>`;
const choice = (name, value, checked, title, text, disabled) =>
  `<label class="choice"><input type="radio" name="${name}" value="${value}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}><b>${title}</b><span>${text}</span></label>`;

function fileIcon(key, type = "") {
  const t = type.toLowerCase(), k = key.toLowerCase();
  if (t.startsWith("image/") || /\.(png|jpe?g|gif|webp|avif|svg)$/.test(k)) return "image";
  if (t.startsWith("video/") || t.startsWith("audio/") || /\.(mp4|webm|mov|mp3|ogg|wav)$/.test(k)) return "media";
  if (/\.(zip|gz|tgz|tar|7z|rar|bz2|xz)$/.test(k)) return "archive";
  if (t.startsWith("text/") || t === "application/pdf" || /\.(pdf|txt|md|csv|json|docx?|xlsx?)$/.test(k)) return "doc";
  return "file";
}

async function api(method, path, body, opts = {}) {
  const init = { method, headers: { "x-boxspace-csrf": "1" }, credentials: "same-origin" };

function toast(msg, bad = false) {

  t.setAttribute("role", bad ? "alert" : "status");
  t.textContent = msg;
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 3000);
}
const fail = e => toast(e.message || String(e), true);

/* ---------- dialogs ---------- */
function dialog(html, onSubmit, onOpen) {
  const d = $("#dlg"), f = $("#dlg-form");
  f.innerHTML = html;
  d.showModal();
  onOpen?.(f);
  $("input:not([type=checkbox]):not([type=radio]), textarea, select, button.primary", f)?.focus();
  return new Promise(resolve => {
    f.onsubmit = async ev => {
      const btn = ev.submitter;
      if (!btn || btn.value === "cancel") { ev.preventDefault(); d.close(); resolve(null); return; }
      ev.preventDefault();
      try {
        btn.disabled = true;
        const res = onSubmit ? await onSubmit(new FormData(f), f) : true;
        if (res !== false) { d.close(); resolve(res); }
      } catch (e) { const er = $(".err", f); if (er) er.textContent = e.message; else fail(e); }
      finally { btn.disabled = false; }
    };
    d.onclose = () => resolve(null);
  });
}
const foot = (ok, danger) => `<p class="err"></p><div class="foot"><button class="btn" value="cancel">Cancelar</button><button class="btn ${danger ? "danger solid" : "primary"}" value="ok">${esc(ok)}</button></div>`;
function confirmDlg(title, text, ok, danger = true) {
  return dialog(`<h2>${esc(title)}</h2><p class="muted">${text}</p>${foot(ok, danger)}`);
}

/* ---------- router ---------- */
function parseHash() {
  const h = location.hash.slice(2);
  const [path, qs] = h.split("?");
  const parts = path.split("/").map(decodeURIComponent);
  return { parts, q: new URLSearchParams(qs || "") };
}

async function render() {
  clearTimeout(pollTimer);
  if (!state.me) {
    try { state.me = await api("GET", "/api/session", undefined, { allow401: true }); }
    catch { return loginView(); }
  }
  const { parts, q } = parseHash();
  const [view, bucket, sub] = parts;
  try {
    if (view === "b" && bucket) return sub === "settings" ? await settingsView(bucket) : await browserView(bucket, q.get("prefix") || "", q.get("q") || "");
    if (view === "keys" && state.me.root) return await keysView();
    if (view === "audit" && state.me.root) return await auditView(q);
    if (view === "ips" && state.me.root) return await ipView();
    if (view === "server" && state.me.admin) return await serverView();
    if (view === "about") return await aboutView();
    return await bucketsView();
  } catch (e) { fail(e); }
}
window.addEventListener("hashchange", render);
document.addEventListener("click", async ev => {
  if (ev.target.closest("#logout")) { await api("POST", "/api/logout").catch(() => {}); state.me = null; location.hash = ""; render(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeDrawer(); });

/* ---------- browser ---------- */
function pathHtml(bucket, prefix) {
  const segs = prefix.split("/").filter(Boolean);
  let acc = "";
  const crumbs = segs.map((s, i) => {
    acc += s + "/";
    return i === segs.length - 1 ? `<span class="sep">/</span><span class="here">${esc(s)}</span>` : `<span class="sep">/</span><a href="#/b/${enc(bucket)}?prefix=${enc(acc)}">${esc(s)}</a>`;
  }).join("");
  return `<div class="path"><a href="#/buckets">Buckets</a><span class="sep">/</span>${segs.length ? `<a href="#/b/${enc(bucket)}">${esc(bucket)}</a>` : `<span class="here">${esc(bucket)}</span>`}${crumbs}</div>`;
}

function bucketTabs(bucket, active) {
  return `<nav class="tabs"><a href="#/b/${enc(bucket)}" ${active === "files" ? 'aria-current="page"' : ""}>Arquivos</a><a href="#/b/${enc(bucket)}/settings" ${active === "settings" ? 'aria-current="page"' : ""}>Configurações</a></nav>`;
}

const selection = { keys: new Set(), prefixes: new Set() };

function rowHtml(bucket, prefix, item, writable, flat) {
  if (item.prefix) {
    const p = item.prefix;
    return `<tr data-p="${esc(p)}">
      <td class="cb"><input type="checkbox" aria-label="Selecionar ${esc(p)}" data-selp="${esc(p)}"></td>
      <td class="name"><a href="#/b/${enc(bucket)}?prefix=${enc(p)}"><span class="ficon folder">${icon("folder")}</span>${esc(p.slice(prefix.length))}</a></td>
      <td class="r faint">Pasta</td><td class="hide-sm"></td>
      <td><div class="row-actions">${writable ? `<button class="btn link danger" data-delprefix="${esc(p)}">Excluir</button>` : ""}</div></td></tr>`;
  }
  const o = item;
  const shown = flat ? o.key : o.key.slice(prefix.length);
  return `<tr data-k="${esc(o.key)}">
    <td class="cb"><input type="checkbox" aria-label="Selecionar ${esc(o.key)}" data-selk="${esc(o.key)}"></td>
    <td class="name"><a href="#" data-info="${esc(o.key)}"><span class="ficon">${icon(fileIcon(o.key, o.contentType))}</span>${esc(shown)}</a>${o.encrypted ? ` <span title="Criptografado" class="faint">${icon("lock")}</span>` : ""}</td>
    <td class="r num">${size(o.size)}</td>
    <td class="hide-sm faint num">${when(o.lastModified)}</td>
    <td><div class="row-actions"><a class="btn link" href="/api/buckets/${enc(bucket)}/download?key=${enc(o.key)}">Baixar</a><button class="btn link" data-share="${esc(o.key)}">Compartilhar</button>${writable ? `<button class="btn link danger" data-delkey="${esc(o.key)}">Excluir</button>` : ""}</div></td></tr>`;
}

function updateBulk(bucket, writable) {
  const n = selection.keys.size + selection.prefixes.size;
  const bar = $("#bulk");
  if (!bar) return;
  bar.hidden = n === 0;
  bar.innerHTML = `<b>${n} selecionado(s)</b><button class="btn" id="bulk-zip">Baixar em ZIP</button>${writable ? '<button class="btn danger" id="bulk-del">Excluir</button>' : ""}<button class="btn" id="bulk-clear">Limpar</button>`;
  $$("tr[data-k], tr[data-p]").forEach(tr => tr.classList.toggle("sel", selection.keys.has(tr.dataset.k) || selection.prefixes.has(tr.dataset.p)));
  $("#bulk-clear").onclick = () => { selection.keys.clear(); selection.prefixes.clear(); $$("[data-selk], [data-selp], #sel-all").forEach(c => c.checked = false); updateBulk(bucket, writable); };
  $("#bulk-zip").onclick = async () => {
    try {
      const r = await api("POST", `/api/buckets/${enc(bucket)}/zip`, { keys: [...selection.keys], prefixes: [...selection.prefixes] });
      const a = document.createElement("a"); a.href = `/api/zip/${r.token}`; document.body.append(a); a.click(); a.remove();
      toast("Preparando o download.");
    } catch (e) { fail(e); }
  };
  $("#bulk-del")?.addEventListener("click", async () => {
    const parts = [];
    if (selection.keys.size) parts.push(`${selection.keys.size} arquivo(s)`);
    if (selection.prefixes.size) parts.push(`${selection.prefixes.size} pasta(s) com todo o conteúdo`);
    if (!await confirmDlg("Excluir seleção", `Serão excluídos ${parts.join(" e ")}.`, "Excluir")) return;
    try {
      const r = await api("POST", `/api/buckets/${enc(bucket)}/bulk-delete`, { keys: [...selection.keys], prefixes: [...selection.prefixes] });
      selection.keys.clear(); selection.prefixes.clear();
      toast(`${r.deleted} arquivo(s) excluído(s).`); render();
    } catch (e) { fail(e); }
  });
}

async function browserView(bucket, prefix, query, token = "", append = false) {
  const [data, b] = await Promise.all([
    query ? api("GET", `/api/buckets/${enc(bucket)}/search?q=${enc(query)}&prefix=${enc(prefix)}`)
          : api("GET", `/api/buckets/${enc(bucket)}/objects?prefix=${enc(prefix)}&token=${enc(token)}`),
    append ? Promise.resolve(null) : api("GET", `/api/buckets/${enc(bucket)}`),
  ]);
  if (b) state.bucket = b;
  const writable = state.bucket.canWrite;
  const items = query ? data.objects : [...data.prefixes.map(p => ({ prefix: p })), ...data.objects.filter(o => o.key !== prefix)];
  const rowsHtml = items.map(i => rowHtml(bucket, prefix, i, writable, !!query)).join("");
  const more = !query && data.nextToken ? `<div class="more"><button class="btn" id="more">Carregar mais</button></div>` : "";

  if (append) {
    $("#rows").insertAdjacentHTML("beforeend", rowsHtml);
    $(".more")?.remove();
    $("#drop .card").insertAdjacentHTML("beforeend", more);
  } else {
    selection.keys.clear(); selection.prefixes.clear();
    const emptyHtml = query ? empty("search", "Nada encontrado", `Nenhum arquivo ${prefix ? "nesta pasta " : ""}tem “${esc(query)}” no nome.`)
      : empty(prefix ? "folder" : "upload", prefix ? "Esta pasta está vazia" : "Este bucket está vazio",
          writable ? "Arraste arquivos ou pastas para cá, ou use o botão Enviar arquivos." : "Não há arquivos aqui.",
          writable ? `<label class="btn primary" for="file-input">${icon("upload")}Enviar arquivos</label>` : "");
    $("#app").innerHTML = shell("buckets", `
      <div class="page-head">${pathHtml(bucket, prefix)}<div class="actions">${writable ? `<button class="btn" id="new-folder">${icon("folder")}Nova pasta</button><label class="btn primary" for="file-input">${icon("upload")}Enviar arquivos</label><input type="file" id="file-input" multiple hidden>` : ""}</div></div>
      ${bucketTabs(bucket, "files")}
      ${state.bucket.readable ? `<p class="note">${chip("Arquivos legíveis", "ok")} Também disponíveis em <code>${esc(state.bucket.readablePath)}</code></p>` : ""}
      <div class="toolbar">
        <form id="search" class="search" role="search">${icon("search")}<input class="input" name="q" type="search" placeholder="Buscar por nome${prefix ? " nesta pasta" : ""}" value="${esc(query)}" aria-label="Buscar"></form>
        ${query ? `<a class="btn ghost" href="#/b/${enc(bucket)}${prefix ? `?prefix=${enc(prefix)}` : ""}">Limpar busca</a><span class="faint small">${data.objects.length}${data.truncated ? "+" : ""} resultado(s)</span>` : ""}
        <div class="bulk" id="bulk" hidden></div>
      </div>
      <div id="drop">${card({ flush: true, body: rowsHtml
        ? `<div class="table-wrap"><table><thead><tr><th class="cb"><input type="checkbox" id="sel-all" aria-label="Selecionar tudo"></th><th>Nome</th><th class="r">Tamanho</th><th class="hide-sm">Modificado em</th><th></th></tr></thead><tbody id="rows">${rowsHtml}</tbody></table></div>${more}`
        : emptyHtml })}</div>`);
    if (writable) wireUploads(bucket, prefix);
    $("#search").onsubmit = ev => {
      ev.preventDefault();
      const v = new FormData(ev.target).get("q").trim();
      const qs = new URLSearchParams(); if (prefix) qs.set("prefix", prefix); if (v) qs.set("q", v);
      location.hash = `#/b/${enc(bucket)}${qs.toString() ? "?" + qs : ""}`;
    };
    $("#sel-all")?.addEventListener("change", ev => {
      $$("[data-selk], [data-selp]").forEach(c => { c.checked = ev.target.checked; c.dispatchEvent(new Event("change")); });
    });
  }
  $$("[data-selk]:not([data-wired]), [data-selp]:not([data-wired])").forEach(c => {
    c.dataset.wired = "1";
    c.onchange = () => {
      const set = c.dataset.selk != null ? selection.keys : selection.prefixes;
      const v = c.dataset.selk ?? c.dataset.selp;
      c.checked ? set.add(v) : set.delete(v);
      updateBulk(bucket, writable);
    };
  });
  updateBulk(bucket, writable);
  $("#more")?.addEventListener("click", () => browserView(bucket, prefix, "", data.nextToken, true).catch(fail));
  $$("[data-info]").forEach(a => a.onclick = ev => { ev.preventDefault(); objectDrawer(bucket, a.dataset.info).catch(fail); });
  $$("[data-share]").forEach(b => b.onclick = () => shareDialog(bucket, b.dataset.share));
  $$("[data-delkey]").forEach(b => b.onclick = async () => {
    const k = b.dataset.delkey;
    if (!await confirmDlg("Excluir arquivo", `<b>${esc(k)}</b> será excluído.`, "Excluir")) return;
    try { await api("DELETE", `/api/buckets/${enc(bucket)}/object?key=${enc(k)}`); toast("Arquivo excluído."); render(); } catch (e) { fail(e); }
  });
  $$("[data-delprefix]").forEach(b => b.onclick = async () => {
    const p = b.dataset.delprefix;
    if (!await confirmDlg("Excluir pasta", `Todos os arquivos em <b>${esc(p)}</b> serão excluídos.`, "Excluir pasta")) return;
    try { const r = await api("DELETE", `/api/buckets/${enc(bucket)}/prefix?prefix=${enc(p)}`); toast(`${r.deleted} arquivo(s) excluído(s).`); render(); } catch (e) { fail(e); }

function wireUploads(bucket, prefix) {
  if (!$("#file-input")) $("#app").insertAdjacentHTML("beforeend", '<input type="file" id="file-input" multiple hidden>');
  $("#file-input").onchange = ev => { upload(bucket, prefix, [...ev.target.files]); ev.target.value = ""; };
  $("#new-folder").onclick = () => dialog(`<h2>Nova pasta</h2><div class="field"><label for="fn">Nome da pasta</label><input id="fn" name="name" required></div>${foot("Criar pasta", false)}`,
    async f => {
      const name = f.get("name").replace(/^\/+|\/+$/g, "");
      if (!name) throw new Error("Informe um nome.");
      await api("PUT", `/api/buckets/${enc(bucket)}/object?key=${enc(prefix + name + "/")}`, new Blob([]));
      location.hash = `#/b/${enc(bucket)}?prefix=${enc(prefix + name + "/")}`;
    });
  const drop = $("#drop");
  drop.ondragover = ev => { ev.preventDefault(); drop.classList.add("dropping"); };
  drop.ondragleave = () => drop.classList.remove("dropping");
  drop.ondrop = async ev => {
    ev.preventDefault(); drop.classList.remove("dropping");
    const files = [];
    const walk = async (entry, path) => {
      if (entry.isFile) await new Promise(r => entry.file(f => { files.push([path + f.name, f]); r(); }, r));
      else if (entry.isDirectory) {
        const reader = entry.createReader();
        let batch;
        do { batch = await new Promise(r => reader.readEntries(r, () => r([]))); for (const e of batch) await walk(e, path + entry.name + "/"); } while (batch.length);
      }
    };
    const items = [...(ev.dataTransfer.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
    if (items.length) { for (const e of items) await walk(e, ""); upload(bucket, prefix, files); }
    else upload(bucket, prefix, [...ev.dataTransfer.files]);
  };
}

function upload(bucket, prefix, files) {
  if (!files.length) return;
  let box = $(".uploads");
  if (!box) {
    box = document.createElement("section");
    box.className = "uploads";
    box.setAttribute("aria-live", "polite");
    box.innerHTML = `<header><span>Envios</span><button class="btn link" id="close-up">Fechar</button></header><ul></ul>`;
    document.body.append(box);
    $("#close-up", box).onclick = () => box.remove();
  }
  const list = $("ul", box);
  let pending = files.length;
  const queue = files.map(f => Array.isArray(f) ? f : [f.name, f]);
  const next = () => {
    const item = queue.shift();
    if (!item) return;
    const [name, file] = item;
    const li = document.createElement("li");
    li.innerHTML = `<div>${esc(name)} <span class="faint num">${size(file.size)}</span></div><div class="bar"><i style="width:0"></i></div>`;
    list.prepend(li);
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", `/api/buckets/${enc(bucket)}/object?key=${enc(prefix + name)}`);
    xhr.setRequestHeader("x-boxspace-csrf", "1");
    if (file.type) xhr.setRequestHeader("content-type", file.type);
    xhr.upload.onprogress = e => { if (e.lengthComputable) $("i", li).style.width = (e.loaded / e.total * 100) + "%"; };
    xhr.onloadend = () => {
      const ok = xhr.status >= 200 && xhr.status < 300;
      li.classList.add(ok ? "done" : "failed");
      $("i", li).style.width = "100%";
      if (!ok) { let m = "falhou"; try { m = JSON.parse(xhr.responseText).error; } catch {} li.insertAdjacentHTML("beforeend", `<div class="err">${esc(m)}</div>`); }
      if (--pending === 0) { toast("Envio concluído."); const h = parseHash(); if (h.parts[0] === "b" && h.parts[1] === bucket) render(); }
      next();
    };
    xhr.send(file);
  };
  for (let i = 0; i < Math.min(3, queue.length); i++) next();
}

function shareDialog(bucket, key) {
  dialog(`<h2>Compartilhar arquivo</h2>
    <p class="muted" style="margin-bottom:14px">Gera um link de download que funciona sem login até expirar.</p>
    <div class="field"><label for="exp">Validade</label><select id="exp" name="exp">
      <option value="3600">1 hora</option><option value="86400" selected>1 dia</option><option value="604800">7 dias</option></select></div>
    <div id="share-out"></div>${foot("Gerar link", false)}`,
    async f => {

      $("#share-out").innerHTML = `<div class="field"><label>Link (expira em ${when(r.expiresAt)})</label><div class="secret"><span>${esc(r.url)}</span><button type="button" class="btn link" id="copy-url">Copiar</button></div></div>`;

/* ---------- object drawer ---------- */
function closeDrawer() { const d = $("#drawer"); if (d) { d.classList.remove("open"); d.setAttribute("aria-hidden", "true"); d.innerHTML = ""; } }

function previewHtml(bucket, o) {
  const url = `/api/buckets/${enc(bucket)}/download?key=${enc(o.key)}&inline=1`;
  const t = (o.contentType || "").toLowerCase();
  if (/^image\/(png|jpe?g|gif|webp|avif|svg\+xml)/.test(t)) return `<div class="preview"><img src="${url}" alt="Pré-visualização de ${esc(o.key)}"></div>`;
  if (t.startsWith("application/pdf")) return `<div class="preview"><iframe src="${url}" title="Pré-visualização do PDF"></iframe></div>`;
  if (/^video\/(mp4|webm)/.test(t)) return `<div class="preview"><video src="${url}" controls preload="metadata"></video></div>`;
  if (/^audio\/(mpeg|ogg|wav|x-wav)/.test(t)) return `<div class="preview"><audio src="${url}" controls preload="metadata"></audio></div>`;
  if ((t.startsWith("text/") || t === "application/json" || t === "application/xml") && o.size <= 2 * 1024 * 1024) return `<div class="preview"><pre id="text-preview">Carregando…</pre></div>`;
  return "";
}

async function objectDrawer(bucket, key) {
  const o = await api("GET", `/api/buckets/${enc(bucket)}/object?key=${enc(key)}`);
  const writable = state.bucket?.canWrite;
  const kv = rows => `<dl class="kv">${rows.filter(r => r[1] !== "" && r[1] != null).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const meta = Object.entries(o.meta || {});
  const versioned = o.versions.length > 1 || o.versionId !== "null";
  const d = $("#drawer");
  d.innerHTML = `<header><h2>${esc(key.split("/").pop() || key)}</h2><button class="btn ghost sm" id="close-drawer">Fechar</button></header>
    <div class="body">
      ${previewHtml(bucket, o)}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn primary" href="/api/buckets/${enc(bucket)}/download?key=${enc(key)}">Baixar</a><button class="btn" id="drawer-share">Compartilhar</button></div>
      ${kv([["Caminho", `<code>${esc(key)}</code>`], ["Tamanho", `<span class="num">${size(o.size)}</span> <span class="faint num">(${o.size.toLocaleString("pt-BR")} bytes)</span>`], ["Tipo", esc(o.contentType)],
            ["Modificado em", when(o.lastModified)], ["ETag", `<code>${esc(o.etag)}</code>`], ["Partes", o.parts ? String(o.parts) : ""],
            ["Criptografia", o.encrypted ? chip("AES-256 (SSE-S3)") : chip("Nenhuma", "plain")], ["No disco", o.diskPath ? `<code>${esc(o.diskPath)}</code>` : ""]])}
      ${meta.length ? `<div><h3 style="margin-bottom:8px">Metadados</h3>${kv(meta.map(([k, v]) => [k, esc(v)]))}</div>` : ""}
      ${o.tags.length ? `<div><h3 style="margin-bottom:8px">Tags</h3><p>${o.tags.map(([k, v]) => chip(`${k} = ${v}`, "plain")).join(" ")}</p></div>` : ""}
      ${versioned ? `<div><h3 style="margin-bottom:8px">Versões</h3><ul class="versions">${o.versions.map(v => `<li>
          <span><span class="num">${when(v.lastModified)}</span> ${v.isLatest ? chip("Atual", "ok") : ""}${v.deleteMarker ? chip("Marcador de exclusão", "warn") : ` <span class="faint num">${size(v.size)}</span>`}</span>
          <span class="row-actions">${v.deleteMarker ? "" : `<a class="btn link" href="/api/buckets/${enc(bucket)}/download?key=${enc(key)}&versionId=${enc(v.versionId)}">Baixar</a>`}${writable ? `<button class="btn link danger" data-delver="${esc(v.versionId)}">Apagar</button>` : ""}</span></li>`).join("")}</ul></div>` : ""}
    </div>`;
  d.classList.add("open");
  d.setAttribute("aria-hidden", "false");
  $("#close-drawer").focus();
  $("#close-drawer").onclick = closeDrawer;
  $("#drawer-share").onclick = () => shareDialog(bucket, key);
  const tp = $("#text-preview");
  if (tp) fetch(`/api/buckets/${enc(bucket)}/download?key=${enc(key)}&inline=1`, { credentials: "same-origin" })
    .then(r => r.text()).then(t => { tp.textContent = t.length > 20000 ? t.slice(0, 20000) + "\n…" : t; }).catch(() => { tp.textContent = "Não foi possível carregar."; });
  $$("[data-delver]", d).forEach(b => b.onclick = async () => {
    if (!await confirmDlg("Apagar versão", "Esta versão será apagada permanentemente.", "Apagar versão")) return;
    try {
      await api("DELETE", `/api/buckets/${enc(bucket)}/object?key=${enc(key)}&versionId=${enc(b.dataset.delver)}`);
      toast("Versão apagada.");
      objectDrawer(bucket, key).catch(() => { closeDrawer(); render(); });
    } catch (e) { fail(e); }
  });
}

  };
  const targetRow = (t = {}) => `<div class="row-box target" data-id="${esc(t.id || "")}">
      <div class="field"><label>Endereço do servidor S3</label><input name="endpoint" value="${esc(t.endpoint || "")}" placeholder="https://s3.us-east-1.amazonaws.com" ${dis}></div>
      <div class="field"><label>Bucket de destino</label><input name="bucket" value="${esc(t.bucket || "")}" ${dis}></div>
      <div class="field"><label>Região</label><input name="region" value="${esc(t.region || "us-east-1")}" ${dis}></div>
      <div class="field"><label>Access key</label><input name="accessKey" value="${esc(t.accessKey || "")}" autocomplete="off" ${dis}></div>
      <div class="field"><label>Secret key</label><input name="secretKey" type="password" placeholder="${t.id ? "mantida" : ""}" autocomplete="new-password" ${dis}></div>
      <div class="opts">
        <div class="field" style="flex:1;min-width:180px"><label>Somente o prefixo</label><input name="prefix" value="${esc(t.prefix || "")}" placeholder="todo o bucket" ${dis}></div>
        <label class="switch"><input type="checkbox" name="replicateDeletes" ${t.replicateDeletes ? "checked" : ""} ${dis}><span>Replicar exclusões</span></label>
        <label class="switch"><input type="checkbox" name="enabled" ${t.enabled !== false ? "checked" : ""} ${dis}><span>Ativo</span></label>
        ${can ? `<button class="btn sm" type="button" data-test>Testar conexão</button>${t.id ? `<button class="btn sm" type="button" data-resync="${esc(t.id)}">Reenviar tudo</button>` : ""}${remove}` : ""}
        <span class="small" data-result></span>
      </div></div>`;
  const rs = b.replicationStats;
  const state1 = (on, yes, no) => on ? chip(yes, "ok") : chip(no, "plain");

    ${card({ title: "Versionamento", desc: "Guarda as versões anteriores de cada arquivo quando ele é substituído ou excluído, para que você possa recuperá-las." + (b.versioning === "Suspended" ? " As versões existentes continuam guardadas." : ""),

      ctl: sw("readable", b.readable, b.readable ? "Ativado" : "Desativado", !can) })}
    ${card({ title: "Criptografia", desc: "Novos arquivos são cifrados no disco com AES-256. Os arquivos já existentes não mudam." + (b.readable ? " Para ativar, desligue antes os arquivos legíveis no disco." : ""),
      ctl: sw("encryption", b.encryption, b.encryption ? "Ativada" : "Desativada", !can) })}
    ${card({ title: "Acesso público", desc: "Define quem pode ler os arquivos sem uma chave de acesso.", ctl: state1(mode !== "private", mode === "public-read" ? "Leitura pública" : "Política personalizada", "Privado"),
      body: `<div class="choices">
          ${choice("mode", "private", mode === "private", "Privado", "Só quem tem uma chave de acesso.", !can)}
          ${choice("mode", "public-read", mode === "public-read", "Leitura pública", "Qualquer pessoa com o endereço pode baixar e listar os arquivos.", !can)}

      ctl: replStatus,

    });
  };
  wire(document);
  const targetData = row => {
    const v = n => $(`[name="${n}"]`, row);
    return { id: row.dataset.id, endpoint: v("endpoint").value.trim(), bucket: v("bucket").value.trim(), region: v("region").value.trim(),
      accessKey: v("accessKey").value.trim(), secretKey: v("secretKey").value, prefix: v("prefix").value,

  $("#add-rule").onclick = () => add("#rules", ruleRow());
  $("#add-hook").onclick = () => add("#hooks", hookRow());
  $("#add-target").onclick = () => add("#targets", targetRow());
  $("#repl-retry")?.addEventListener("click", async () => { try { const r = await api("POST", `${bp}/replication/retry`); toast(`${r.retried} envio(s) recolocados na fila.`); render(); } catch (e) { fail(e); } });
  $("#save-targets").onclick = async () => {
    try { const r = await api("PUT", `${bp}/replication`, { targets: $$("#targets .target").map(targetData) }); toast(r.queued ? `Replicação salva. ${r.queued} arquivo(s) existente(s) na fila.` : "Replicação salva."); render(); } catch (e) { fail(e); }
  };
  const num = el => el.value ? +el.value : null;
  $("#save-rules").onclick = async () => {
    const rules = $$("#rules .rule").map(r => ({ prefix: $('[name="prefix"]', r).value, enabled: $('[name="enabled"]', r).checked,
      expirationDays: num($('[name="expirationDays"]', r)), noncurrentDays: num($('[name="noncurrentDays"]', r)), abortDays: num($('[name="abortDays"]', r)) }));
    try { await api("PUT", `${bp}/lifecycle`, { rules }); toast("Regras salvas."); render(); } catch (e) { fail(e); }
  };
  $("#save-hooks").onclick = async () => {
    const webhooks = $$("#hooks .hook").map(h => {
      const ev = $('[name="events"]', h).value;

    });
    try { await api("PUT", `${bp}/webhooks`, { webhooks }); toast("Notificações salvas."); render(); } catch (e) { fail(e); }
  };
}

/* ---------- keys ---------- */
function grantSummary(k) {
  if (!k.grants?.length) return k.readOnly ? chip("Todos os buckets, só leitura", "warn") : chip("Todos os buckets");
  return k.grants.map(g => chip(`${g.bucket} ${g.write && !k.readOnly ? "(leitura e escrita)" : "(leitura)"}`, g.write && !k.readOnly ? "" : "warn")).join(" ");
}

function keyForm(k = {}) {
  const specific = (k.grants || []).length > 0;
  const grantRow = (g = {}) => `<div class="row-box grant">
      <div class="field"><label>Bucket (aceita *)</label><input name="gbucket" value="${esc(g.bucket || "")}" placeholder="fotos-*"></div>
      <div class="field"><label>Acesso</label><select name="gwrite"><option value="0">Leitura</option><option value="1" ${g.write ? "selected" : ""}>Leitura e escrita</option></select></div>
      <button class="btn link danger" type="button" data-remove>Remover</button></div>`;
  return {
    html: `<div class="field"><label for="desc">Descrição</label><input id="desc" name="description" value="${esc(k.description || "")}" placeholder="backup do servidor web"></div>
      <p class="label" style="margin-bottom:6px">Alcance</p>
      <div class="choices" style="margin-bottom:14px">
        ${choice("scope", "all", !specific, "Todos os buckets", "Pode criar buckets e mudar configurações, se não for somente leitura.")}
        ${choice("scope", "some", specific, "Buckets específicos", "Acesso só aos buckets listados, sem criar buckets nem mudar configurações.")}
      </div>
      <label class="check" id="ro-box" ${specific ? "hidden" : ""}><input type="checkbox" name="readOnly" ${k.readOnly ? "checked" : ""}><span>Somente leitura</span></label>
      <div id="grants-box" ${specific ? "" : "hidden"}><div class="grid-rows" id="grants" style="margin-bottom:10px">${(k.grants?.length ? k.grants : [{}]).map(grantRow).join("")}</div>
      <button class="btn sm" type="button" id="add-grant">${icon("plus")}Adicionar bucket</button></div>`,
    wire: f => {
      const sync = () => { const some = $('[name="scope"]:checked', f).value === "some"; $("#grants-box", f).hidden = !some; $("#ro-box", f).hidden = some; };
      $$('[name="scope"]', f).forEach(r => r.onchange = sync);
      const wireRm = root => $$("[data-remove]", root).forEach(x => x.onclick = () => x.closest(".row-box").remove());
      wireRm(f);
      $("#add-grant", f).onclick = () => { $("#grants", f).insertAdjacentHTML("beforeend", grantRow()); wireRm($("#grants", f).lastElementChild); };
    },
    read: (fd, f) => {
      const some = fd.get("scope") === "some";
      const grants = some ? $$("#grants .grant", f).map(r => ({ bucket: $('[name="gbucket"]', r).value.trim(), write: $('[name="gwrite"]', r).value === "1" })).filter(g => g.bucket) : [];
      if (some && !grants.length) throw new Error("Adicione pelo menos um bucket.");
      return { description: fd.get("description"), readOnly: !some && fd.get("readOnly") === "on", grants };
    },
  };
}

/* ---------- audit ---------- */
async function auditView(q) {
  const params = new URLSearchParams();
  for (const k of ["key", "bucket", "op"]) if (q.get(k)) params.set(k, q.get(k));
  if (q.get("errors")) params.set("errors", "1");
  const r = await api("GET", `/api/audit?${params}`);
  const rows = r.entries.map(e => `<tr>
      <td class="faint num" style="white-space:nowrap">${whenFull(e.time)}</td>
      <td>${e.accessKey ? `<span class="mono">${esc(e.accessKey)}</span>` : '<span class="faint">anônimo</span>'}</td>
      <td>${esc(e.op)}${e.source === "console" ? " " + chip("console", "plain") : ""}</td>
      <td class="name">${esc(e.bucket || "")}${e.key ? `<span class="faint">/${esc(e.key)}</span>` : ""}</td>
      <td>${chip(String(e.status), e.status >= 400 ? "bad" : "ok")}${e.error ? ` <span class="small faint">${esc(e.error)}</span>` : ""}</td>
      <td class="hide-sm faint mono">${esc(e.remote)}</td>
      <td class="hide-sm r num faint">${e.durationMs} ms</td></tr>`).join("");
  $("#app").innerHTML = shell("audit", `
    ${pageHead("Auditoria", "Quem fez o quê, quando e de onde: cada requisição à API, cada ação no console e cada tentativa de login.")}
    ${r.enabled ? "" : '<div class="banner">O log de auditoria está desligado (<code>BOXSPACE_AUDIT=0</code>).</div>'}
    <form class="toolbar" id="afilter">
      <input class="input" name="key" placeholder="Access key" value="${esc(q.get("key") || "")}" style="max-width:190px">
      <input class="input" name="bucket" placeholder="Bucket" value="${esc(q.get("bucket") || "")}" style="max-width:170px">
      <input class="input" name="op" placeholder="Operação, ex.: DeleteObject" value="${esc(q.get("op") || "")}" style="max-width:240px">
      <label class="switch"><input type="checkbox" name="errors" ${q.get("errors") ? "checked" : ""}><span>Só erros</span></label>
      <button class="btn">Filtrar</button>
    </form>
    ${card({ flush: true, body: r.entries.length ? `<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Chave</th><th>Operação</th><th>Alvo</th><th>Resultado</th><th class="hide-sm">IP</th><th class="hide-sm r">Duração</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : empty("list", "Nenhum registro", "Nada corresponde a estes filtros nos últimos 7 dias."),
      foot: `<span class="left faint small">Até 200 registros mais recentes dos últimos 7 dias. Os arquivos completos ficam em <code>.boxspace/audit/</code> no primeiro disco.</span>` })}`);
  $("#afilter").onsubmit = ev => {
    ev.preventDefault();
    const f = new FormData(ev.target), p = new URLSearchParams();
    for (const k of ["key", "bucket", "op"]) if (f.get(k)) p.set(k, f.get(k).trim());
    if (f.get("errors")) p.set("errors", "1");
    location.hash = `#/audit${p.toString() ? "?" + p : ""}`;
  };
}

/* ---------- server ---------- */
function modeText(s) {
  const n = s.disks.length;
  if (s.mode === "single") return "Um disco, sem redundância. Se o disco falhar, os dados se perdem; use replicação ou backups.";
  if (s.mode === "mirror") return `Espelhamento: cada arquivo é gravado em todos os ${n} discos. Os dados continuam disponíveis com até ${n - 1} disco(s) perdido(s).`;
  const pct = Math.round(s.parity / n * 100);
  return `Erasure coding: cada bloco de dados vira ${s.dataShards} fragmento(s) de dados e ${s.parity} de paridade, um em cada disco. Os dados continuam disponíveis com até ${s.parity} disco(s) perdido(s); ${pct}% do espaço é usado para proteção.`;
}

function modeDiagram(s) {
  if (s.mode !== "erasure") return "";
  const d = Array.from({ length: s.dataShards }, (_, i) => `<span class="shard d">D${i + 1}</span>`).join("");
  const p = Array.from({ length: s.parity }, (_, i) => `<span class="shard p">P${i + 1}</span>`).join("");
  return `<p class="small faint" style="margin-bottom:4px">Cada bloco gravado:</p><div class="shards" aria-label="${s.dataShards} fragmentos de dados e ${s.parity} de paridade">${d}${p}</div>`;
}

async function serverView() {
  const [i, s] = await Promise.all([api("GET", "/api/info"), api("GET", "/api/system")]);
  const h = s.heal;
  const bays = s.disks.map(d => {
    const used = d.total ? (d.total - d.free) / d.total * 100 : 0;
    return `<div class="bay ${d.online ? "" : "off"}">
      <div class="bay-top"><div class="drive" aria-hidden="true"></div><div><div class="bay-title">Disco ${d.index + 1}</div>${d.online ? chip("Online", "ok") : chip("Offline", "bad")}</div></div>
      <code>${esc(d.path)}</code>
      ${d.total ? `<div class="usage"><div class="bar ${used > 90 ? "bad" : used > 75 ? "warn" : ""}"><i style="width:${used}%"></i></div><span class="small faint num">${size(d.free)} livres de ${size(d.total)}</span></div>` : ""}
    </div>`;
  }).join("");
  const healBody = h.running ? `<p>${chip("Em andamento")} ${h.checked.toLocaleString("pt-BR")} versão(ões) verificada(s)…</p>`
    : h.finished ? `<dl class="kv"><dt>Última verificação</dt><dd>${whenFull(h.finished)}${h.deep ? " (completa)" : ""}</dd><dt>Verificadas</dt><dd class="num">${h.checked.toLocaleString("pt-BR")}</dd><dt>Reparadas</dt><dd class="num">${h.healed}</dd><dt>Sobras removidas</dt><dd class="num">${h.orphans}</dd><dt>Irrecuperáveis</dt><dd>${h.lostCount ? chip(String(h.lostCount), "bad") : '<span class="num">0</span>'}</dd></dl>`
    : '<p class="faint">Ainda não houve verificação desde que o servidor iniciou.</p>';
  $("#app").innerHTML = shell("server", `
    ${s.writable ? "" : '<div class="banner bad">Não há discos online suficientes para gravar. Leituras podem continuar funcionando.</div>'}
    ${pageHead("Servidor", "Discos, integridade dos dados e monitoramento.")}
    <div class="stats">
      <div class="stat"><b class="num">${i.buckets}</b><span>buckets</span></div>
      <div class="stat"><b class="num">${i.objects.toLocaleString("pt-BR")}</b><span>objetos</span></div>
      <div class="stat"><b class="num">${size(i.bytes)}</b><span>armazenados (todas as versões)</span></div>
      <div class="stat"><b class="num">${i.disksOnline}/${i.disks}</b><span>discos online</span></div>
    </div>
    ${card({ title: "Discos", desc: esc(modeText(s)), ctl: chip(s.mode === "single" ? "Um disco" : s.mode === "mirror" ? "Espelhamento" : "Erasure coding", s.mode === "single" ? "warn" : "ok"),
      body: `${modeDiagram(s)}<div class="bays">${bays}</div>`,
      foot: '<span class="left faint small">Para trocar um disco, pare o servidor, monte o disco novo no mesmo diretório e inicie de novo: os dados são reconstruídos automaticamente.</span>' })}
    ${card({ title: "Verificação de integridade", desc: `Confere se todas as cópias e fragmentos estão no lugar, reconstrói o que faltar e remove sobras de envios interrompidos. Roda sozinha a cada ${Math.round(s.healIntervalSecs / 3600)} hora(s) e sempre que um disco volta.`,
      ctl: h.running ? chip("Em andamento") : h.lostCount ? chip("Com problemas", "bad") : h.finished ? chip("Tudo certo", "ok") : "",
      body: `${healBody}
        ${h.lost?.length ? `<p class="small" style="margin-top:12px">Objetos que não podem ser reconstruídos:</p><pre>${h.lost.map(esc).join("\n")}</pre>` : ""}
        ${h.errors?.length ? `<p class="small" style="margin-top:12px">Erros:</p><pre>${h.errors.slice(0, 20).map(esc).join("\n")}</pre>` : ""}`,
      foot: `<span class="left faint small">A verificação completa lê todos os dados para detectar corrupção silenciosa e pode demorar.</span><button class="btn" id="heal-deep" ${h.running ? "disabled" : ""}>Verificação completa</button><button class="btn primary" id="heal" ${h.running ? "disabled" : ""}>Verificar agora</button>` })}
    ${card({ title: "Monitoramento", body: `<dl class="kv">
        <dt>Saúde</dt><dd><code>${esc(i.serverUrl)}/_boxspace/health</code></dd>
        <dt>Métricas</dt><dd><code>${esc(i.serverUrl)}/_boxspace/metrics</code> ${s.metricsEnabled ? (s.metricsProtected ? chip("com token") : chip("públicas", "warn")) : chip("desligadas", "plain")}</dd>
        <dt>Auditoria</dt><dd>${s.audit ? chip("Ligada", "ok") : chip("Desligada", "warn")}</dd>
        <dt>Replicação</dt><dd>${s.replication.pending} pendente(s), ${s.replication.failed} com falha</dd>
      </dl>${s.metricsEnabled ? "" : '<p class="small faint" style="margin-top:12px">Para coletar métricas com Prometheus, defina <code>BOXSPACE_METRICS_TOKEN</code>.</p>'}` })}
    ${connectCard(i)}`);
  const go = deep => async () => { try { await api("POST", "/api/system/heal", { deep }); toast("Verificação iniciada."); setTimeout(render, 600); } catch (e) { fail(e); } };
  $("#heal").onclick = go(false);
  $("#heal-deep").onclick = go(true);
  if (h.running) pollTimer = setTimeout(() => { if (parseHash().parts[0] === "server") render(); }, 3000);
}

  const i = await api("GET", "/api/info");
  $("#app").innerHTML = shell("about", `${pageHead("Conectar", "Como usar o BoxSpace a partir das suas aplicações.")}
    <div class="stats"><div class="stat"><b class="num">${i.buckets}</b><span>buckets</span></div><div class="stat"><b class="num">${i.objects.toLocaleString("pt-BR")}</b><span>objetos</span></div><div class="stat"><b class="num">${size(i.bytes)}</b><span>armazenados</span></div></div>
    ${connectCard(i)}`);
}

render();
</script>
