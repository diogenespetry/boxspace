name: CI e imagem Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/boxspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testes unitários
        run: cargo test --locked
      - name: Testes de compatibilidade (boto3)
        run: |
          cargo build --locked
          pip install boto3 requests
          python3 tests/compat_test.py target/debug/boxspace

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem de teste (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: boxspace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testar o container
        run: |
          docker run -d --name bs -p 9000:9000 -p 9001:9001 \
            -e BOXSPACE_ROOT_USER=ciadmin -e BOXSPACE_ROOT_PASSWORD=cisecret123 boxspace:ci
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done
          docker logs bs
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/)" = "403"
          curl -sf http://localhost:9001/ | grep -q BoxSpace
          pip install boto3
          python3 - <<'EOF'
          import boto3
          s3 = boto3.client("s3", endpoint_url="http://localhost:9000", region_name="us-east-1",
                            aws_access_key_id="ciadmin", aws_secret_access_key="cisecret123")
          s3.create_bucket(Bucket="ci")
          s3.put_object(Bucket="ci", Key="ola.txt", Body=b"funciona")
          assert s3.get_object(Bucket="ci", Key="ola.txt")["Body"].read() == b"funciona"
          print("container OK")
          EOF

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Publicar imagem (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
